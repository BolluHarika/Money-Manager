spring.application.name=money-manager

#Mysql Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/moneymanager}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

server.port=${PORT:8080}
server.servlet.context-path=/api/v1.0

#JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Email configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=${BREVO_FROM_EMAIL}

jwt.secret=${JWT_SECRET}

money.manager.frontend.url=${MONEY_MANAGER_FRONTEND_URL:http://localhost:5173}

app.activation.url=${MONEY_MANAGER_BACKEND_URL:http://localhost:8080}
#spring.profiles.active=prod